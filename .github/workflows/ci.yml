name: CI
on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: clashbot_test
          MARIADB_USER: clashbot
          MARIADB_PASSWORD: ci-password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://clashbot:ci-password@127.0.0.1:3306/clashbot_test
      CR_API_KEY: ci-test-not-a-real-key
      SESSION_SECRET: ci-test-session-secret-at-least-32-characters
      SIGNUP_TOKEN: ci-test-signup-token-at-least-32-characters
      BASE_URL: http://localhost:3000
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npx prisma migrate deploy
      - name: Database integration
        run: npm run test:integration
      - name: Start application without Discord or Telegram
        run: |
          node dist/index.js > /tmp/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/ready
          curl --fail http://127.0.0.1:3000/ > /dev/null
      - name: Logs on failure
        if: failure()
        run: cat /tmp/app.log || true
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify clean deployment
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:3000/ready
          docker compose exec -T bot node -e "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)})"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove test containers
        if: always()
        run: docker compose down -v
