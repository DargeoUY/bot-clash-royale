services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definí DB_ROOT_PASSWORD}
      MARIADB_DATABASE: clashbot
      MARIADB_USER: ${DB_USER:-clashbot}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    init: true
    environment:
      NODE_ENV: production
      HEALTHCHECK_PORT: 3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - logs:/app/logs
      - backups:/app/backups
      - whatsapp_sessions:/app/sessions
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  db_data:
  logs:
  backups:
  whatsapp_sessions:
